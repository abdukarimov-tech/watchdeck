name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: Agent (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # protoc нужен prost-build (agent-core/build.rs)
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --check
        working-directory: agent
      - run: cargo clippy -- -D warnings
        working-directory: agent
      - run: cargo test
        working-directory: agent
      - run: cargo build --release
        working-directory: agent

  relay:
    name: Relay (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # protoc нужен prost-build (relay/build.rs)
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --check
        working-directory: relay
      - run: cargo clippy -- -D warnings
        working-directory: relay
      - run: cargo test
        working-directory: relay
      - run: cargo build --release
        working-directory: relay
      - run: PULSE_TEST_RELAY_BIN=target/release/pulse-relay python3 tests/monitoring_e2e.py
        working-directory: relay

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # setup-android@v3 ломается с cmdline-tools 16.0 на раннере; SDK уже
      # предустановлен на ubuntu-latest — достаточно принять лицензии
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: ./gradlew testDebugUnitTest
        working-directory: android
      - run: ./gradlew assembleDebug lintDebug
        working-directory: android

  ios:
    name: iOS + WidgetKit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/PulseCore
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - run: xcodebuild -project ios/WatchDeck.xcodeproj -scheme WatchDeck -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
