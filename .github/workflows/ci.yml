name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  agent:
    name: Agent (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # protoc нужен prost-build (agent-core/build.rs)
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --check
        working-directory: agent
      - run: cargo clippy -- -D warnings
        working-directory: agent
      - run: cargo test
        working-directory: agent
      - run: cargo build --release
        working-directory: agent

  relay:
    name: Relay (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # protoc нужен prost-build (relay/build.rs)
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo fmt --check
        working-directory: relay
      - run: cargo clippy -- -D warnings
        working-directory: relay
      - run: cargo test
        working-directory: relay
      - run: cargo build --release
        working-directory: relay

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # setup-android@v3 ломается с cmdline-tools 16.0 на раннере; SDK уже
      # предустановлен на ubuntu-latest — достаточно принять лицензии
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: gradle testDebugUnitTest
        working-directory: android
      - run: gradle assembleDebug
        working-directory: android
