name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent-binaries:
    name: Agent binaries (linux)
    runs-on: ubuntu-latest
    env:
      # иначе rustc берет host `cc` + bundled rust-lld и падает на
      # --fix-cortex-a53-843419 (только AArch64); GNU ld флаг поддерживает
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu protobuf-compiler
      - name: Build agent
        run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: agent
      - name: Build relay
        run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: relay
      - name: Test Linux x86_64 binaries
        if: matrix.arch == 'x86_64'
        run: |
          cargo test --locked --manifest-path agent/Cargo.toml --target ${{ matrix.target }}
          cargo test --locked --manifest-path relay/Cargo.toml --target ${{ matrix.target }}
          PULSE_TEST_RELAY_BIN="$GITHUB_WORKSPACE/relay/target/${{ matrix.target }}/release/pulse-relay" python3 relay/tests/monitoring_e2e.py
      - name: Prepare artifacts
        run: |
          cp agent/target/${{ matrix.target }}/release/pulse-agent pulse-agent-${{ matrix.arch }}
          cp relay/target/${{ matrix.target }}/release/pulse-relay pulse-relay-${{ matrix.arch }}
          sha256sum pulse-agent-${{ matrix.arch }} pulse-relay-${{ matrix.arch }} > sha256-${{ matrix.arch }}.txt
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: |
            pulse-agent-${{ matrix.arch }}
            pulse-relay-${{ matrix.arch }}
            sha256-${{ matrix.arch }}.txt

  android-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # setup-android@v3 ломается с cmdline-tools 16.0 на раннере ("Failed to
      # find package 'tools'"); SDK уже предустановлен на ubuntu-latest —
      # достаточно принять лицензии
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build release (unsigned without secrets)
        run: ./gradlew assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android-release
          path: android/app/build/outputs/apk/release/*.apk

  github-release:
    name: Attach artifacts to GitHub Release
    # публикация не зависит от APK: бинарники relay/agent критичны для
    # bootstrap-установки, APK собирается локально и в Play Console
    needs: [agent-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: CHANGELOG.md
          draft: true
