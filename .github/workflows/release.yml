name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent-binaries:
    name: Agent binaries (linux)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: pulse-agent-x86_64
          - target: aarch64-unknown-linux-gnu
            artifact: pulse-agent-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross linkers
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu
      - name: Build agent
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: agent
      - name: Build relay
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: relay
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Prepare artifacts
        run: |
          cp agent/target/${{ matrix.target }}/release/pulse-agent pulse-agent-${{ matrix.artifact }}
          cp relay/target/${{ matrix.target }}/release/pulse-relay pulse-relay-${{ matrix.artifact }}
          sha256sum pulse-agent-${{ matrix.artifact }} pulse-relay-${{ matrix.artifact }} > sha256.txt
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact }}
          path: |
            pulse-agent-${{ matrix.artifact }}
            pulse-relay-${{ matrix.artifact }}
            sha256.txt

  android-apk:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build release (unsigned without secrets)
        run: gradle assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-android-release
          path: android/app/build/outputs/apk/release/*.apk

  github-release:
    name: Attach artifacts to GitHub Release
    needs: [agent-binaries, android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
