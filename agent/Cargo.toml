[workspace]
resolver = "2"
members = ["crates/agent-core", "crates/agent-bin"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
prost = "0.13"
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
