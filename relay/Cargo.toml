[package]
name = "pulse-relay"
version = "1.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
prost = "0.13"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# явный CryptoProvider: в дереве есть и ring (reqwest/tungstenite), и aws-lc-rs
# (axum-server) — rustls 0.23 без install_default() паникует на старте TLS
rustls = { version = "0.23", features = ["ring"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
rand = "0.8"
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2"] }
gcp_auth = "0.12"
base64 = "0.22"
ring = "0.17"

[build-dependencies]
prost-build = "0.13"

[profile.release]
opt-level = "z"
lto = true
strip = true
